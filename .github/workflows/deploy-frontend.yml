name: Deploy Angular to SmarterASP.NET

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # FTP_REMOTE_DIR must be the frontend site's folder: --delete removes anything
      # in it that is not part of this build.
      - name: Upload to SmarterASP via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          cd "$FTP_REMOTE_DIR"
          mirror --reverse --overwrite --delete --parallel=4 --verbose ./dist/DocuVault/browser/ ./
          bye
          EOF
