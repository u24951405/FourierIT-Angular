<div class="auth-page">
  <div class="auth-card">
    <h1>Reset Password</h1>
    <p>Enter your new password below to update your account.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="emailAddress">Email</label>
        <input id="emailAddress" type="email" formControlName="emailAddress" placeholder="your@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" formControlName="newPassword" placeholder="New password" autocomplete="new-password" />
        <span *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched" class="field__error">
          Password must be at least 8 characters.
        </span>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="Confirm password" autocomplete="new-password" />
        <span *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched" class="field__error">
          Passwords do not match.
        </span>
      </div>
      <input type="hidden" formControlName="token" />

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        {{ isLoading() ? 'Resetting…' : 'Reset Password' }}
      </button>
    </form>

    <div *ngIf="successMessage()" class="alert alert-success">{{ successMessage() }}</div>
    <div *ngIf="errorMessage()" class="alert alert-error">{{ errorMessage() }}</div>

    <div class="auth-card__actions">
      <a routerLink="/auth/login">Back to login</a>
    </div>
  </div>
</div>
