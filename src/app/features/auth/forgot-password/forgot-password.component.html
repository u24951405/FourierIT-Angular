<div class="auth-page">
  <div class="auth-card">
    <h1>Forgot Password</h1>
    <p>Enter the email address for your account and we’ll send a password reset link.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="emailAddress">Email</label>
        <input id="emailAddress" type="email" formControlName="emailAddress" placeholder="Enter your email" autocomplete="email" />
        <span class="field__error" *ngIf="form.get('emailAddress')?.invalid && form.get('emailAddress')?.touched">
          Please enter a valid email address.
        </span>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="isLoading()">
          {{ isLoading() ? 'Sending…' : 'Send reset link' }}
        </button>
      </div>
    </form>

    <div *ngIf="successMessage()" class="alert alert-success">{{ successMessage() }}</div>
    <div *ngIf="errorMessage()" class="alert alert-error">{{ errorMessage() }}</div>

    <div class="auth-card__actions">
      <a routerLink="/auth/login">Back to login</a>
    </div>
  </div>
</div>
