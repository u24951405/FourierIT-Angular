<section class="coming-soon">
  <h1>My Documents</h1>
  <p>Review your submissions and continue with document uploads.</p>

  <div class="card" style="margin-top: 1rem; max-width: 480px; padding: 1.25rem; border: 1px solid #d0dce8; border-radius: 10px; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.06);">
    <h2 style="font-size: 1rem; margin-bottom: 0.5rem;">Document Upload</h2>
    <p style="margin-bottom: 1rem; color: #4a6278;">Use this temporary entry point to continue the upload workflow while signed in.</p>
    <button type="button" class="btn btn--primary" (click)="openTemporaryUploadPage()">
      Continue to Upload Documents
    </button>
  </div>
</section>
