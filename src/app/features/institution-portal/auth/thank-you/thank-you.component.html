<div class="thankyou-root">
  <div class="thankyou-card">
    <div class="thankyou-brand">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>
      <div class="thankyou-badge">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5">
          <path d="M20 6L9 17l-5-5"></path>
        </svg>
      </div>
    </div>

    <h1 class="thankyou-title">Thank you</h1>
    <p class="thankyou-message">Your institution session has been securely ended.</p>
    <p class="thankyou-note">For your safety, the session data was cleared from this browser. You can now close this tab.</p>

    <div class="thankyou-actions">
      <button class="thankyou-btn thankyou-btn--primary" type="button" (click)="closeTab()">Close tab</button>
      <button class="thankyou-btn thankyou-btn--outline" type="button" (click)="returnToSignIn()">Return to sign-in</button>
    </div>
  </div>
</div>
