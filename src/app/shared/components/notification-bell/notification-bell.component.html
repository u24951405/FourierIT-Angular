<button type="button"
        class="bell"
        [class.bell--open]="open()"
        (click)="toggle($event)"
        [attr.aria-expanded]="open()"
        [attr.aria-label]="unreadCount() > 0 ? 'Notifications, ' + unreadCount() + ' unread' : 'Notifications'">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
  </svg>
  @if (unreadCount() > 0) {
    <span class="bell__count" aria-hidden="true">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
  }
</button>

@if (open()) {
  <section class="panel" role="dialog" aria-label="Notifications" (click)="$event.stopPropagation()">
    <header class="panel__header">
      <h3>Notifications</h3>
      @if (unreadCount() > 0) {
        <button type="button" class="panel__mark-all" (click)="markAllAsRead()">Mark all as read</button>
      }
    </header>

    @if (loading()) {
      <p class="panel__state">Loading…</p>
    } @else if (error()) {
      <p class="panel__state panel__state--error">{{ error() }}</p>
    } @else if (notifications().length === 0) {
      <p class="panel__state">You're all caught up.</p>
    } @else {
      <ul class="panel__list">
        @for (item of notifications(); track item.notificationId) {
          <li>
            <button type="button"
                    class="item"
                    [class.item--unread]="!item.isRead"
                    [ngClass]="'item--' + tone(item)"
                    (click)="select(item)">
              <span class="item__subject">{{ item.subject }}</span>
              <span class="item__message">{{ item.message }}</span>
              <span class="item__time">{{ item.createdAt | date:'medium' }}</span>
            </button>
          </li>
        }
      </ul>
    }
  </section>
}
